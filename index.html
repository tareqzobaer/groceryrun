<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fcffeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1e0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grocery Run">
<title>Grocery Run</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f3ecd9'/><ellipse cx='32' cy='42' rx='18' ry='17' fill='%23b7472a'/><path d='M32 25 C32 20 36 16 41 16 C41 22 37 25 32 25 Z' fill='%235d8a3b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fcffeb;
    --ink: #1e2010;
    --ink-soft: #4a5230;
    --ink-faded: #8a9470;
    --rule: #c8d48a;
    --rule-soft: #dce8a8;
    --check: #4a7a2a;
    --accent: #b7472a;
    --input-bg: rgba(255,255,255,0.55);
    --input-bg-focus: rgba(255,255,255,0.85);
    --paste-bg: rgba(250,255,230,0.55);
    --font: 'Roboto', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1e0f;
      --ink: #e8edcc;
      --ink-soft: #a8b880;
      --ink-faded: #5a6645;
      --rule: #3a4520;
      --rule-soft: #2e3818;
      --check: #72b84a;
      --accent: #e06040;
      --input-bg: rgba(255,255,255,0.06);
      --input-bg-focus: rgba(255,255,255,0.10);
      --paste-bg: rgba(255,255,255,0.04);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    overscroll-behavior: contain;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.46 0 0 0 0 0.32 0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.55; pointer-events: none; z-index: 1; mix-blend-mode: multiply;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(120,90,40,0.08) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 2;
    max-width: 540px; margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header {
    text-align: center; margin-bottom: 26px;
    padding-bottom: 18px; position: relative;
  }
  header::after {
    content: ''; position: absolute;
    left: 8%; right: 8%; bottom: 0;
    height: 1px; background: var(--rule);
    box-shadow: 0 4px 0 -3px var(--rule-soft);
  }
  h1 { font-weight: 700; font-size: 32px; line-height: 1; margin: 0; letter-spacing: -0.5px; }
  .date { font-weight: 400; font-size: 13px; color: var(--ink-soft); margin-top: 8px; letter-spacing: 0.6px; text-transform: uppercase; }

  .paste-section {
    background: var(--paste-bg);
    border: 1px dashed var(--rule);
    border-radius: 10px; padding: 16px;
    margin-bottom: 24px;
    transition: padding 0.25s ease;
  }
  .paste-section.collapsed { padding: 12px 16px; }
  .paste-toggle {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  .arrow { transition: transform 0.25s ease; font-size: 14px; }
  .paste-section.collapsed .arrow { transform: rotate(-90deg); }
  .paste-content {
    overflow: hidden; max-height: 600px;
    transition: max-height 0.3s ease, margin-top 0.25s ease;
    margin-top: 14px;
  }
  .paste-section.collapsed .paste-content { max-height: 0; margin-top: 0; }

  textarea {
    width: 100%; min-height: 160px;
    border: 1px solid var(--rule); border-radius: 8px;
    background: var(--input-bg);
    font-family: var(--font); font-size: 16px;
    color: var(--ink);
    resize: vertical; outline: none;
    padding: 14px; line-height: 1.6;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  textarea:focus { border-color: var(--ink-soft); background: var(--input-bg-focus); }
  textarea::placeholder { color: var(--ink-faded); }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button {
    font-family: var(--font); font-size: 14px; font-weight: 500;
    border: none;
    background: var(--ink); color: var(--paper);
    padding: 13px 18px; border-radius: 8px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
    flex: 1; -webkit-appearance: none;
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  button:active { transform: scale(0.97); }
  button.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); }

  .add-manual {
    display: flex; gap: 8px;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px dashed var(--rule);
  }
  .add-manual input {
    border: 1px solid var(--rule); border-radius: 8px;
    background: var(--input-bg);
    font-family: var(--font); font-size: 16px;
    color: var(--ink);
    padding: 12px 14px; outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
    min-width: 0;
  }
  .add-manual input:focus { border-color: var(--ink-soft); background: var(--input-bg-focus); }
  .add-manual input.name-input { flex: 1; }
  .add-manual input.qty-input { flex: 0 0 70px; text-align: center; }
  .add-manual button { flex: 0 0 56px; font-size: 24px; padding: 8px 12px; line-height: 1; text-transform: none; letter-spacing: 0; }

  /* ── Category groups ── */
  .group { margin-bottom: 18px; }
  .cat-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--ink-soft);
    padding: 14px 4px 8px;
    border-bottom: 1px solid var(--rule);
  }
  .cat-icon { font-size: 16px; }
  .cat-count {
    margin-left: auto;
    font-size: 11px; font-weight: 500;
    color: var(--ink-faded); letter-spacing: 0.5px;
  }

  ul.cat-list { list-style: none; padding: 0; margin: 0; }

  li.item {
    display: flex; align-items: center;
    padding: 14px 6px;
    border-bottom: 1px solid var(--rule-soft);
    gap: 14px;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: opacity 0.25s ease;
    animation: slideIn 0.25s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .check {
    width: 26px; height: 26px;
    border: 2px solid var(--ink); border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease;
    background: transparent;
  }
  .check::after {
    content: '✓';
    color: var(--paper); font-weight: 700; font-size: 15px;
    opacity: 0; transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.5,1.6,.4,1);
  }
  li.item.done .check { background: var(--check); border-color: var(--check); }
  li.item.done .check::after { opacity: 1; transform: scale(1); }

  .name {
    flex: 1; font-weight: 400; font-size: 17px;
    transition: all 0.25s ease;
    word-break: break-word;
  }
  li.item.done .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-faded); }

  .qty {
    font-size: 14px; font-weight: 600; color: var(--accent);
    flex-shrink: 0; min-width: 32px; text-align: right;
    letter-spacing: 0.3px;
  }
  li.item.done .qty { color: var(--ink-faded); text-decoration: line-through; }

  .delete {
    background: transparent; border: none;
    color: var(--ink-faded); font-size: 22px;
    padding: 4px 10px; flex: 0 0 auto; width: auto;
    opacity: 0.5; line-height: 1; border-radius: 6px;
    text-transform: none; letter-spacing: 0;
  }
  .delete:active { color: var(--accent); opacity: 1; background: rgba(183,71,42,0.08); }

  .empty {
    text-align: center; padding: 56px 20px 32px;
    color: var(--ink-faded); font-size: 14px; line-height: 1.6;
  }
  .empty .arrow-up { display: block; font-size: 26px; margin-bottom: 10px; opacity: 0.6; }

  .summary {
    text-align: center; margin-top: 24px; padding: 12px;
    font-size: 13px; font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.6px; text-transform: uppercase;
    transition: color 0.25s ease;
  }
  .summary.complete { color: var(--check); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Groceries</h1>
      <div class="date" id="date"></div>
    </header>

    <div class="paste-section" id="pasteSection">
      <div class="paste-toggle" onclick="togglePaste()">
        <span>paste your list</span>
        <span class="arrow">▾</span>
      </div>
      <div class="paste-content">
        <textarea id="input" placeholder="2 apples&#10;1 loaf of bread&#10;milk&#10;eggs x 12&#10;tomatoes - 4"></textarea>
        <div class="actions">
          <button onclick="parseAndAdd()">add to list</button>
          <button class="secondary" onclick="clearAll()">clear all</button>
        </div>
        <div class="add-manual">
          <input type="text" id="manualName" class="name-input" placeholder="Quick add">
          <input type="text" id="manualQty" class="qty-input" placeholder="Qty" inputmode="decimal">
          <button onclick="addManual()">+</button>
        </div>
      </div>
    </div>

    <div id="list"></div>
    <div class="summary" id="summary"></div>
  </div>

<script>
  // ───────────────────────────────────────────────────────────────
  //  Category dictionary
  //  Order matters: first match wins.
  // ───────────────────────────────────────────────────────────────
  const CATEGORIES = [

    ['Pantry', '🥫', [
      'rice', 'chal', 'polao chal', 'flour', 'atta', 'maida', 'suji', 'semolina', 'sugar',
      'salt', 'oil', 'vinegar', 'soy sauce', 'ketchup', 'semai', 'lachcha',
      'mustard', 'jam', 'honey', 'peanut butter', 'pasta', 'noodle',
      'spaghetti', 'macaroni', 'lentil', 'dal', 'daal',
      'chickpea', 'chola', 'tea', 'coffee', 'cocoa', 'chana daal',
      'baking', 'yeast', 'cornstarch', 'corn starch', 'soup', 'broth',
      'sauce', 'tomato paste', 'canned', 'tinned', 'pickle', 'achar', 'cereal',
      'oat', 'oatmeal', 'granola', 'tin', 'can', 'custard', 'seed', 'besan'
    ]],
    ['Dairy & Eggs', '🥛', [
      'milk', 'cheese', 'butter', 'yogurt', 'tok doi',
      'cream', 'ghee', 'paneer', 'chana', 'egg'
    ]],
    ['Meat & Fish', '🐟', [
      'chicken', 'beef', 'mutton', 'khasi', 'lamb',
      'fish', 'mach', 'shrimp', 'prawn',
      'salmon', 'tuna', 'ilish', 'hilsa', 'rui', 'katla', 'tilapia', 'pomfret',
      'rupchanda', 'pangash', 'pangas', 'koi', 'magur', 'shing', 'goat', 'duck'
    ]],
    ['Snacks', '🍪', [
      'biscuit', 'cookie', 'cracker', 'chip',
      'chocolate', 'candy', 'sweet', 'mishti', 'chanachur',
      'jhalmuri', 'popcorn', 'nut', 'almond', 'cashew',
      'peanut', 'pistachio', 'walnut', 'raisin', 'naru'
    ]],
    ['Household and Toiletries', '🧴', [
      'soap', 'shampoo', 'toothpaste', 'toothbrush', 'detergent', 'body wash',
      'surf', 'tissue', 'paper towel', 'toilet paper', 'cleaner',
      'bleach', 'sponge', 'foil', 'plastic bag', 'trash bag',
      'garbage bag', 'battery', 'bulb', 'match', 'candle',
      'razor', 'deodorant', 'lotion', 'comb', 'brush', 'mosquito',
      'odomos', 'harpic', 'vim', 'vim bar', 'liquid soap', 'lizol'
    ]],
    ['Spices', '🧂', [
      'spice', 'masala', 'turmeric',
      'cumin', 'jeera', 'coriander', 'dhonia', 'cardamom',
      'elach', 'cinnamon', 'daruchini', 'clove', 'lobongo', 'paprika',
      'bay leaf', 'tej pata', 'saffron', 'jafran', 'panch foron', 'oregano', 'chilli powder',
      'herb'
    ]],
    ['Bakery', '🥖', [
      'bread', 'loaf', 'bun', 'roll', 'bagel', 'croissant', 'cake', 'pastry',
      'muffin', 'donut', 'tortilla', 'naan', 'paratha',
      'ruti', 'toast'
    ]],
    ['Fruit', '🍎', [
      'apple', 'banana', 'orange', 'grape', 'strawberry',
      'blueberry', 'raspberry', 'mango', 'pineapple',
      'watermelon', 'melon', 'papaya', 'kiwi', 'peach', 'pear',
      'plum', 'cherry', 'avocado',
      'pomegranate', 'guava', 'peyara', 'lichi', 'lychee', 'jackfruit',
      'date', 'fig', 'apricot', 'tangerine', 'mosambi',
      'gooseberry', 'mandarin'
    ]],
    ['Vegetable', '🥕', [
      'tomato', 'potato', 'onion',
      'garlic', 'roshun', 'ginger', 'carrot', 'cabbage',
      'cauliflower', 'broccoli', 'spinach', 'lettuce',
      'cucumber', 'pepper', 'capsicum', 'eggplant', 'brinjal',
      'chili', 'chilli', 'lady finger', 'okra', 'pumpkin',
      'gourd', 'lau', 'kakrol', 'patal', 'shim', 'bean',
      'pea', 'corn', 'mushroom', 'celery', 'radish', 'beet', 'beetroot',
      'kale', 'asparagus', 'zucchini', 'shak', 'puishak', 'data', 'kachu',
      'sweet potato', 'mishti aloo', 'cilantro', 'lemon', 'lime'
    ]],
    ['Frozen', '❄', [
      'ice cream', 'frozen', 'kulfi', 'frozen fish', 'frozen paratha', 'frozen ruti'
    ]],
    ['Drinks', '🥤', [
      'water', 'juice', 'coke', 'pepsi', 'sprite', 'fanta',
      '7up', 'mountain dew', 'tang', 'mojo', 'frutika',
      'glucose', 'rooh afza'
    ]]

  ];
  const OTHER_ICON = '📦';

  // Escape regex metacharacters in a literal string
  function reEscape(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Given a singular keyword, return a regex fragment that matches both
  // the singular and its English plural form.
  // Rules:
  //   ends in consonant+y  -> "berry"  → "berr(?:y|ies)"
  //   ends in s/x/z/ch/sh  -> "box"    → "box(?:es)?"
  //   ends in o            -> "tomato" → "tomato(?:es|s)?"
  //   anything else        -> "apple"  → "apples?"
  function pluralPattern(word) {
    const w = reEscape(word);
    if (/[^aeiou]y$/i.test(word)) {
      // strip the trailing y, then allow "y" or "ies"
      return w.slice(0, -1) + '(?:y|ies)';
    }
    if (/(s|x|z|ch|sh)$/i.test(word)) {
      return w + '(?:es)?';
    }
    if (/o$/i.test(word)) {
      return w + '(?:es|s)?';
    }
    return w + 's?';
  }

  function categorize(name) {
    const text = (name || '').toLowerCase();
    if (!text) return 'Other';
    for (const [cat, , keywords] of CATEGORIES) {
      for (const kw of keywords) {
        if (kw.includes(' ')) {
          // Multi-word: pluralize the LAST word only
          // ("ice cream" → "ice creams?", "lady finger" → "lady fingers?")
          const parts = kw.split(' ');
          const last = parts.pop();
          const head = parts.map(reEscape).join('\\s+');
          const pattern = (head ? head + '\\s+' : '') + pluralPattern(last);
          const re = new RegExp('(^|[^a-z])' + pattern + '([^a-z]|$)', 'i');
          if (re.test(text)) return cat;
        } else {
          const re = new RegExp('(^|[^a-z])' + pluralPattern(kw) + '([^a-z]|$)', 'i');
          if (re.test(text)) return cat;
        }
      }
    }
    return 'Other';
  }

  // ───────────────────────────────────────────────────────────────
  //  State + storage
  // ───────────────────────────────────────────────────────────────
  const STORAGE_KEY = 'grocery-list-v1';
  let items = [];

  document.getElementById('date').textContent = new Date()
    .toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) items = JSON.parse(raw) || [];
    } catch (e) { items = []; }
    render();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    catch (e) { console.warn('save failed', e); }
  }

  // ───────────────────────────────────────────────────────────────
  //  Parsing
  // ───────────────────────────────────────────────────────────────
  function parseLine(raw) {
    let line = raw.trim();
    if (!line) return null;
    line = line.replace(/^[\-•\*\+→›►◦‣⁃]+\s*/, '');
    line = line.replace(/^\d+[\.\)]\s+/, '');
    if (!line) return null;

    const num = '\\d+(?:[\\.,]\\d+)?';
    let m;
    m = line.match(new RegExp('^(' + num + ')\\s*[x×]?\\s+(.+)$', 'i'));
    if (m && m[2].trim()) return { name: m[2].trim(), qty: toNum(m[1]) };
    m = line.match(new RegExp('^(.+?)\\s+[x×]\\s*(' + num + ')\\s*$', 'i'));
    if (m) return { name: m[1].trim(), qty: toNum(m[2]) };
    m = line.match(new RegExp('^(.+?)\\s*\\((' + num + ')\\)\\s*$'));
    if (m) return { name: m[1].trim(), qty: toNum(m[2]) };
    m = line.match(new RegExp('^(.+?)\\s*[\\-–—:]\\s*(' + num + ')\\s*$'));
    if (m) return { name: m[1].trim(), qty: toNum(m[2]) };
    m = line.match(new RegExp('^(.+?)\\s+(' + num + ')\\s*$'));
    if (m) return { name: m[1].trim(), qty: toNum(m[2]) };
    return { name: line, qty: 1 };
  }
  function toNum(s) { return parseFloat(String(s).replace(',', '.')); }

  // ───────────────────────────────────────────────────────────────
  //  Actions
  // ───────────────────────────────────────────────────────────────

  // Strip English plural suffixes to get a canonical singular form.
  // Mirrors the same rules used in pluralPattern():
  //   cherries → cherry   (ies → y, when preceded by a consonant)
  //   tomatoes → tomato   (oes → o)
  //   boxes    → box      (ses/xes/zes/ches/shes → base)
  //   apples   → apple    (trailing s, but not ss)
  // Words that are already singular pass through unchanged.
  function singularize(word) {
    const w = word.trim().toLowerCase();
    // consonant + ies → y  (cherries → cherry, berries → berry)
    if (/[^aeiou]ies$/.test(w)) return w.slice(0, -3) + 'y';
    // oes → o  (tomatoes → tomato, potatoes → potato)
    if (/[^aeiou]oes$/.test(w)) return w.slice(0, -2);
    // sibilant + es → base  (boxes → box, dishes → dish, buzzes → buzz)
    if (/(s|x|z|ch|sh)es$/.test(w)) return w.slice(0, -2);
    // plain s, but not ss, and word must be at least 4 chars (guards "bus", "gas")
    if (w.length >= 4 && /[^s]s$/.test(w)) return w.slice(0, -1);
    return w;
  }

  // If an item with the same singular root already exists,
  // bump its quantity and un-check it. Otherwise add as a new entry.
  // The stored name is always the singular form so the list stays tidy.
  function addOrMerge(name, qty) {
    const root = singularize(name);
    const existing = items.find(i => singularize(i.name) === root);
    if (existing) {
      existing.qty = (existing.qty || 1) + (qty || 1);
      existing.done = false;
      return false;
    }
    // Capitalize the first letter nicely, store as singular
    const stored = root.charAt(0).toUpperCase() + root.slice(1);
    items.push({ id: Date.now() + Math.random(), name: stored, qty, done: false });
    return true;
  }

  function parseAndAdd() {
    const ta = document.getElementById('input');
    const text = ta.value;
    if (!text.trim()) return;
    let touched = 0;
    for (const line of text.split(/\r?\n/)) {
      const p = parseLine(line);
      if (p && p.name) {
        addOrMerge(p.name, p.qty);
        touched++;
      }
    }
    if (touched > 0) {
      ta.value = '';
      save();
      render();
      document.getElementById('pasteSection').classList.add('collapsed');
    }
  }

  function addManual() {
    const nameEl = document.getElementById('manualName');
    const qtyEl = document.getElementById('manualQty');
    const name = nameEl.value.trim();
    if (!name) return;
    const qty = parseFloat(qtyEl.value.replace(',', '.')) || 1;
    addOrMerge(name, qty);
    nameEl.value = ''; qtyEl.value = '';
    save(); render();
    nameEl.focus();
  }

  function toggleDone(id) {
    const it = items.find(i => i.id === id);
    if (it) { it.done = !it.done; save(); render(); }
  }
  function deleteItem(id, ev) {
    if (ev) ev.stopPropagation();
    items = items.filter(i => i.id !== id);
    save(); render();
  }
  function clearAll() {
    if (items.length === 0) return;
    if (confirm('Clear the whole list?')) { items = []; save(); render(); }
  }
  function togglePaste() {
    document.getElementById('pasteSection').classList.toggle('collapsed');
  }

  function formatQty(q) {
    if (q === 1) return '';
    const display = Number.isInteger(q) ? q : q.toFixed(2).replace(/\.?0+$/, '');
    return '×' + display;
  }

  // ───────────────────────────────────────────────────────────────
  //  Render — grouped by category
  // ───────────────────────────────────────────────────────────────
  function render() {
    const container = document.getElementById('list');
    container.innerHTML = '';

    if (items.length === 0) {
      container.innerHTML = '<div class="empty"><span class="arrow-up">↑</span>Nothing here yet.<br>Paste a list or quick-add above.</div>';
      document.getElementById('summary').textContent = '';
      return;
    }

    // group by category
    const groups = new Map();
    for (const [cat] of CATEGORIES) groups.set(cat, []);
    groups.set('Other', []);
    for (const item of items) {
      const cat = categorize(item.name);
      groups.get(cat).push(item);
    }

    // render each non-empty group in order
    const catMeta = new Map(CATEGORIES.map(([cat, icon]) => [cat, icon]));
    catMeta.set('Other', OTHER_ICON);

    for (const [cat, list] of groups) {
      if (list.length === 0) continue;
      const groupEl = document.createElement('div');
      groupEl.className = 'group';

      const header = document.createElement('div');
      header.className = 'cat-header';
      const doneCount = list.filter(i => i.done).length;
      header.innerHTML =
        `<span class="cat-icon">${catMeta.get(cat)}</span>` +
        `<span>${cat}</span>` +
        `<span class="cat-count">${doneCount}/${list.length}</span>`;
      groupEl.appendChild(header);

      const ul = document.createElement('ul');
      ul.className = 'cat-list';

      // unchecked first within each category
      list.sort((a, b) => (a.done === b.done) ? 0 : (a.done ? 1 : -1));

      for (const item of list) {
        const li = document.createElement('li');
        li.className = 'item' + (item.done ? ' done' : '');
        li.onclick = () => toggleDone(item.id);

        const check = document.createElement('div'); check.className = 'check';
        const name = document.createElement('div'); name.className = 'name'; name.textContent = item.name;
        const qty = document.createElement('div'); qty.className = 'qty'; qty.textContent = formatQty(item.qty);
        const del = document.createElement('button');
        del.className = 'delete'; del.innerHTML = '×';
        del.setAttribute('aria-label', 'remove');
        del.onclick = (e) => deleteItem(item.id, e);

        li.append(check, name, qty, del);
        ul.appendChild(li);
      }
      groupEl.appendChild(ul);
      container.appendChild(groupEl);
    }

    const done = items.filter(i => i.done).length;
    const total = items.length;
    const summary = document.getElementById('summary');
    summary.textContent = (done === total) ? '✓ all done' : `${done} of ${total} picked`;
    summary.classList.toggle('complete', done === total && total > 0);
  }

  ['manualName', 'manualQty'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addManual(); }
    });
  });

  load();

  // ───── PWA: register service worker ─────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
